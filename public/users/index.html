<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Portal | Duckland</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <nav class="nav-bar">
      <img
        class="nav-bar-img"
        src="images\cropped-ects-logo.png"
        alt="ECTS logo"
      />
      <div class="nav-buttons">
        <a class="btn nav-bar-btn" href="/">Home</a>
        <a class="btn nav-bar-btn" href="/admin">Admin</a>
        <a class="btn nav-bar-btn" href="/docs">Documentation</a>
        <a class="btn nav-bar-btn" style="margin-right: 20px" href="/signout"
          >Sign Out</a
        >
      </div>
    </nav>
    <main class="shell">
      <div class="actions" style="margin-bottom: 1rem">
        <a class="btn secondary" href="/">Back</a>
      </div>

      <section class="panel">
        <h1>Request a Duck</h1>
        <p class="muted">All new requests start as pending approval.</p>

        <form id="duck-form">
          <div class="grid-2">
            <label>
              Duck name
              <input max="15" name="name" required />
            </label>
            <label>
              Assembler
              <input id="assembler" name="assembler" required />
            </label>
          </div>

          <label>
            Adjectives (comma separated)
            <input
              name="adjectives"
              placeholder="brave, chill, speedy"
              required
            />
          </label>

          <label>
            Bio
            <textarea name="bio" required></textarea>
          </label>

          <fieldset>
            <legend>Duck Parts Colors</legend>
            <div class="grid-2">
              <label>
                Head
                <select name="head" required>
                  <option value="red">Red</option>
                  <option value="yellow" selected>Yellow</option>
                  <option value="green">Green</option>
                  <option value="blue">Blue</option>
                  <option value="brown">Brown</option>
                  <option value="purple">Purple</option>
                  <option value="pink">Pink</option>
                </select>
              </label>

              <label>
                Front Left
                <select name="frontLeft" required>
                  <option value="red">Red</option>
                  <option value="yellow">Yellow</option>
                  <option value="green">Green</option>
                  <option value="blue">Blue</option>
                  <option value="brown" selected>Brown</option>
                  <option value="purple">Purple</option>
                  <option value="pink">Pink</option>
                </select>
              </label>

              <label>
                Front Right
                <select name="frontRight" required>
                  <option value="red">Red</option>
                  <option value="yellow">Yellow</option>
                  <option value="green">Green</option>
                  <option value="blue">Blue</option>
                  <option value="brown">Brown</option>
                  <option value="purple" selected>Purple</option>
                  <option value="pink">Pink</option>
                </select>
              </label>

              <label>
                Rear Left
                <select name="rearLeft" required>
                  <option value="red">Red</option>
                  <option value="yellow">Yellow</option>
                  <option value="green">Green</option>
                  <option value="blue">Blue</option>
                  <option value="brown" selected>Brown</option>
                  <option value="purple">Purple</option>
                  <option value="pink">Pink</option>
                </select>
              </label>

              <label>
                Rear Right
                <select name="rearRight" required>
                  <option value="red">Red</option>
                  <option value="yellow">Yellow</option>
                  <option value="green">Green</option>
                  <option value="blue">Blue</option>
                  <option value="brown" selected>Brown</option>
                  <option value="purple">Purple</option>
                  <option value="pink">Pink</option>
                </select>
              </label>
            </div>
          </fieldset>

          <label class="inline-check">
            <input type="checkbox" name="derpy" />
            Derpy
          </label>

          <section class="preview-shell" aria-label="Duck preview">
            <h2>3D Preview</h2>
            <p class="muted" style="margin-top: 0">
              Updates as you change duck colors.
            </p>
            <div
              id="duck-preview"
              class="duck-preview"
              role="img"
              aria-label="Spinning 3D duck preview"
            ></div>
          </section>

          <label>
            Date
            <input id="date" type="date" name="date" required />
          </label>

          <div class="grid-2">
            <label
              ><div class="attribute">
                <p>Strength:</p>
                <div id="strength-number">1</div>
              </div>
              <input
                type="range"
                name="strength"
                min="0"
                max="10"
                value="1"
                required
            /></label>
            <label
              ><div class="attribute">
                <p>Health:</p>
                <div id="health-number">1</div>
              </div>
              <input
                type="range"
                name="health"
                min="0"
                max="10"
                value="1"
                required
            /></label>
            <label
              ><div class="attribute">
                <p>Focus:</p>
                <div id="focus-number">1</div>
              </div>
              <input
                type="range"
                name="focus"
                min="0"
                max="10"
                value="1"
                required
            /></label>
            <label
              ><div class="attribute">
                <p>Intelligence:</p>
                <div id="intelligence-number">1</div>
              </div>
              <input
                type="range"
                name="intelligence"
                min="0"
                max="10"
                value="1"
                required
            /></label>
          </div>

          <label>
            <div class="attribute">
              <p>Kindness:</p>
              <div id="kindness-number">1</div>
            </div>
            <input
              type="range"
              name="kindness"
              min="0"
              max="10"
              value="1"
              required
            />
          </label>

          <div class="actions">
            <button id="submit-button" type="submit">Submit Request</button>
          </div>
          <small id="form-status" class="muted"></small>
        </form>
      </section>
    </main>
    <script type="module" src="/users/app.js"></script>
    <script>
      const date = document.querySelector("#date");
      const assembler = document.querySelector("#assembler");
      const slider_list = document.querySelectorAll('input[type="range"]');
      slider_list.forEach((slider) => {
        slider.oninput = function () {
          const number = document.querySelector(`#${slider.name}-number`);
          number.innerHTML = this.value;
        };
      });

      date.readOnly = true;
      date.classList.add("input-greyed");

      fetch("/api/me")
        .then((res) => res.json())
        .then((data) => {
          if (data.user == null) {
            return;
          }
          assembler.value = data.name;
          assembler.readOnly = true;
          assembler.classList.add("input-greyed");
        });
    </script>
  </body>
</html>
